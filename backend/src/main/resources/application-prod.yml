spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mente_programador}
    username: ${SPRING_DATASOURCE_USERNAME:mente_programador}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost}

server:
  port: ${PORT:8080}
