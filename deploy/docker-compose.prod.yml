services:
  postgres:
    image: postgres:16-alpine
    container_name: mente-prog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mente_programador}
      POSTGRES_USER: ${POSTGRES_USER:-mente_programador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - mente_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mente_network

  backend:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/tu-usuario}/mente-backend:${IMAGE_TAG:-latest}
    container_name: mente-prog-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mente_programador}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mente_programador}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - mente_network

  frontend:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/tu-usuario}/mente-frontend:${IMAGE_TAG:-latest}
    container_name: mente-prog-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mente_network

volumes:
  mente_postgres_prod_data:

networks:
  mente_network:
    driver: bridge
